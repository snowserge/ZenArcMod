name: Regression tests
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check zen-safe-close.uc.js
      - run: node --test

  firefox-layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ZSC_BROWSER_DEPS: ${{ github.workspace }}/.browser-test-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: npm install --prefix "$ZSC_BROWSER_DEPS" --no-save --no-package-lock playwright@1.64.1
      - name: Install Firefox
        run: '"$ZSC_BROWSER_DEPS/node_modules/.bin/playwright" install --with-deps firefox'
      - name: Check Firefox folder rendering
        run: node tests/browser/folder-layout.cjs
